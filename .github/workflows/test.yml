name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The recorder runs the suite as `python -m unittest discover -s tests` would and also writes
      # per-test time and outcome for the quality books (lyddonb/quality). It is a CI tool, pinned
      # by commit, and not a dependency of the package: the tests still need only the standard library.
      - uses: actions/checkout@v4
        with:
          repository: lyddonb/agent-kit
          ref: 2899067e8250775f570753f62892c73f8c32f2cc  # agent-kit main after #37 (qualitydirector 0.1.0)
          path: .agent-kit
          sparse-checkout: plugins/bstack/skills/qualitydirector/scripts
      - name: Unit tests (standard library only), recorded
        run: python .agent-kit/plugins/bstack/skills/qualitydirector/scripts/quality.py record tests --out "$RUNNER_TEMP/test-results.jsonl" --repo agent-ledger
      - name: Upload the test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-agent-ledger-py${{ matrix.python }}
          path: ${{ runner.temp }}/test-results.jsonl
          if-no-files-found: error
      - name: Installs and runs as a command
        run: |
          python -m pip install .
          ledger --version
