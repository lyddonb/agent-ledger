name: changes

# Reports a pull request that changes a file outside the bookkeeping files and adds no change
# record (.changes/<date>-<slug>.json, written by agent-kit's debrief skill), or adds one with a
# problem. Observe mode: it prints what it would have failed and never fails a pull request.
# To enforce, drop --observe.

on:
  # Only main's copy of this file runs, on pull_request_target, so a pull request can't edit the
  # checker pin or its flags for its own check (agent-kit H13).
  # edited: retargeting a pull request to another base reruns the check against the new base.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  change-record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The change to check (data only)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: checked
          fetch-depth: 0  # the check compares the pull request with where it left the base
          persist-credentials: false

      # GitHub rebuilds refs/pull/N/merge in the background, so right after a push it can still
      # hold the previous head; a check of that would pass for the new one.
      - name: The merge commit holds the pull request's current head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          merged="$(git -C checked rev-parse HEAD^2)"
          if [ "$merged" != "$HEAD_SHA" ]; then
            echo "::error::refs/pull/$PR/merge holds $merged, not the head $HEAD_SHA; push again or edit the pull request to rerun (a rerun of this job keeps the old head)"
            exit 1
          fi

      # Pinned so a change to the checker reaches this repo only through a PR here.
      - uses: actions/checkout@v4
        with:
          repository: lyddonb/agent-kit
          ref: 951bae90e7240a278c178de0af25a4d0b8eda050  # agent-kit main after #74 (debrief.py check --base)
          path: agent-kit
          sparse-checkout: plugins/bstack/skills/debrief/scripts
          persist-credentials: false

      - name: The pull request carries a change record (observe)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 agent-kit/plugins/bstack/skills/debrief/scripts/debrief.py check --base "origin/$BASE_REF" --root checked --observe
