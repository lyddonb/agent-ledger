name: ledger-verify
description: Verify agent-ledger audit chains, seals and append-only history, and scan .audit for secrets.
author: lyddonb

inputs:
  root:
    description: >-
      The checkout to check, relative to the workspace. With pull_request_target, check out the
      pull request's merge commit into its own folder and pass it here (see the S3 spec).
    required: false
    default: "."
  base:
    description: >-
      The ref whose merged ledgers must stay unchanged apart from appended lines. Default: for a
      pull request, the merge commit's first parent (the base branch as GitHub merged it); for a
      merge queue, its base; for a push, the commit before the push.
    required: false
    default: ""
  python-version:
    description: Python to run the ledger CLI with (3.10 or newer; it uses only the standard library).
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: ledger verify and scan
      shell: bash
      env:
        RUNNER_SCRIPT: ${{ github.action_path }}/ci/run_ledger.py
        ROOT_INPUT: ${{ inputs.root }}
        BASE_INPUT: ${{ inputs.base }}
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.base_ref }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        set -uo pipefail
        root="$(cd "$GITHUB_WORKSPACE" && cd "$ROOT_INPUT" && pwd)" || { echo "::error::root $ROOT_INPUT isn't a folder"; exit 1; }
        if [ "$(git -C "$root" rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::ledger-verify needs the full history to check seals and the base: set fetch-depth: 0 on actions/checkout"
          exit 1
        fi
        base="$BASE_INPUT"
        if [ -z "$base" ]; then
          case "$EVENT" in
            pull_request|pull_request_target)
              # GitHub's merge commit: its first parent is the base branch as it was merged
              # with, so a base branch that moved on since can't fail an honest change.
              if ! git -C "$root" rev-parse --verify --quiet HEAD^2 >/dev/null; then
                echo "::error::check out the pull request's merge commit (refs/pull/<n>/merge), not its head"
                exit 1
              fi
              base="$(git -C "$root" rev-parse HEAD^1)"
              if ! git -C "$root" merge-base --is-ancestor "$base" "refs/remotes/origin/$PR_BASE"; then
                echo "::error::the merge commit's first parent isn't on origin/$PR_BASE"
                exit 1
              fi
              ;;
            merge_group)
              base="$MERGE_GROUP_BASE"
              ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                base="$PUSH_BEFORE"
              fi
              ;;
          esac
        fi
        args=(--root "$root")
        if [ -n "$base" ]; then
          args+=(--base "$base")
        elif [ "$EVENT" = "push" ]; then
          echo "::warning::this push creates the branch, so there is no base; merged lines aren't checked as append-only"
        else
          echo "::error::no base for a $EVENT event; pass the base input"
          exit 1
        fi
        ledger() { python -I "$RUNNER_SCRIPT" "$@"; }
        status=0
        echo "::group::ledger verify ${args[*]}"
        ledger verify "${args[@]}" || status=1
        echo "::endgroup::"
        echo "::group::ledger scan ${args[*]}"
        ledger scan "${args[@]}" || status=1
        echo "::endgroup::"
        if [ "$status" -ne 0 ]; then
          echo "::error::ledger-verify failed; see the verify and scan output above"
        fi
        exit "$status"
